# Di-include di setiap location, karena location yang punya add_header sendiri tidak lagi mewarisi header dari blok
# server (pola compro). HSTS dipasang di Cloudflare, bukan di sini.
# CSP diperiksa terhadap build sungguhan (Sprint 12): index.html tanpa script atau style inline, bundle tanpa eval,
# font dan foto dari origin sendiri. Binding :style Vue memakai CSSOM, yang tidak diatur style-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
