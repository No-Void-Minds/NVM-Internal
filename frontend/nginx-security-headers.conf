# Di-include di setiap location, karena location yang punya add_header sendiri tidak lagi mewarisi header dari blok
# server (pola compro). HSTS dipasang di Cloudflare, bukan di sini.
# CSP diperiksa terhadap build sungguhan (Sprint 12): index.html tanpa script atau style inline, bundle tanpa eval,
# font dan foto dari origin sendiri. Binding :style Vue memakai CSSOM, yang tidak diatur style-src.
# blob: dipakai pratinjau lampiran (Sprint 11d): berkas diambil sebagai blob supaya backend tetap mengirim
# Content-Disposition attachment. Blob hanya bisa dibuat origin ini sendiri, dan iframe PDF dipagari
# sandbox tanpa allow-same-origin.
# drive.google.com dan *.googleusercontent.com di img-src hanya untuk thumbnail file Drive di dialog Aktivitas
# (revisi 21): /thumbnail dialihkan ke googleusercontent. Direktif lain tidak dibuka.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://drive.google.com https://*.googleusercontent.com; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
