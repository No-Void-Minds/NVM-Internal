# Template: NVM_GATEWAY_IP diisi dari environment saat container start (NGINX_ENVSUBST_FILTER=NVM_), variabel Nginx
# seperti $remote_addr tidak ikut diganti.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Lampiran task maksimal 50 MB di backend, ditambah header multipart. Lampiran Aktivitas Harian punya
  # batasnya sendiri yang lebih besar, hanya di location-nya (revisi 24).
  client_max_body_size 51m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # cloudflared berjalan di host dan masuk lewat 127.0.0.1:8094, jadi request-nya datang dari gateway jaringan
  # Docker nvm-internal. Hanya alamat itu yang boleh menyebut IP pengunjung lewat CF-Connecting-IP; header yang
  # sama dari alamat lain diabaikan. Harus sama dengan NVM_GATEWAY_IP di deploy/docker-compose.yml.
  set_real_ip_from ${NVM_GATEWAY_IP};
  real_ip_header CF-Connecting-IP;

  # DNS Docker. Dengan variabel, nama backend di-resolve ulang, jadi Nginx tidak terus mengirim ke IP lama setelah
  # backend dibuat ulang, dan tetap bisa start walaupun backend belum nyala (pola doomsday).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass $backend;
    proxy_http_version 1.1;
    # Host asli wajib diteruskan: pemeriksaan sameOrigin di backend membandingkan Origin dengan Host (S12-15).
    proxy_set_header Host $host;
    # $remote_addr sudah IP pengunjung setelah real_ip. Ditimpa, bukan ditambah ($proxy_add_x_forwarded_for),
    # supaya klien tidak bisa menyelipkan IP palsu ke limiter login dan audit log.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Unggahan 50 MB lewat Wi-Fi atau data seluler yang lambat.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Lampiran Aktivitas Harian: 95 MB di backend (Cloudflare menolak di atas 100 MB), ditambah ruang header
  # multipart. Hanya di rute ini, supaya rute lain tetap menolak unggahan besar lebih awal.
  location = /api/activities/files {
    include /etc/nginx/security-headers.conf;
    client_max_body_size 96m;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Video 95 MB lewat Wi-Fi kantor butuh waktu jauh lebih panjang daripada lampiran task.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
  }

  # Nama berkas dari Vite berisi hash. Berkas yang tidak ada dijawab 404, bukan index.html, supaya browser yang
  # mencari bundle lama tidak menerima HTML dengan tipe yang salah.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Font D-DIN (nama tanpa hash) dan lisensinya: 30 hari, jadi font baru sampai ke pengguna dalam sebulan.
  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # SPA: semua path lain ke index.html, yang tidak boleh disimpan cache supaya versi baru langsung terpakai.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
