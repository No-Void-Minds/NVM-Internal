name: nvm-internal-app

# Bawaan Docker tidak membatasi ukuran log, sedangkan disk VM terbatas (pola doomsday).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  backend:
    build:
      context: ../backend
    image: nvm-internal-backend:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # Ditulis satu per satu (pola compro), supaya isi .env yang lain tidak ikut masuk container.
    environment:
      APP_ENV: production
      HTTP_ADDR: ':8080'
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL di deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di deploy/.env}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?isi COOKIE_DOMAIN di deploy/.env}
      STORAGE_DIR: /data/storage
      # Hanya Nginx di jaringan ini yang boleh mengisi X-Forwarded-For (A5).
      TRUSTED_PROXIES: ${NVM_SUBNET:-172.30.94.0/24}
    # Dimiliki UID 65532 (user nonroot di image distroless), lihat docs/runbook-deploy.md.
    volumes:
      - /srv/nvm-internal/storage:/data/storage
    networks:
      - nvm
      - postgres

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-}
        VITE_ALLOWED_RETURN_HOSTS: ${VITE_ALLOWED_RETURN_HOSTS:-}
    image: nvm-internal-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Harus sama dengan gateway jaringan nvm di bawah; nginx hanya memercayai CF-Connecting-IP dari alamat ini.
      NVM_GATEWAY_IP: ${NVM_GATEWAY_IP:-172.30.94.1}
      NGINX_ENVSUBST_FILTER: NVM_
    # Satu-satunya port di host, dan hanya di 127.0.0.1: publik masuk lewat cloudflared di VM (S14-03).
    ports:
      - '127.0.0.1:${NVM_PORT:-8094}:80'
    # Menguji Nginx, backend, dan koneksi database sekaligus. Backend distroless tidak punya shell atau wget,
    # jadi pemeriksaan dijalankan dari image Nginx (pola doomsday).
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - nvm

networks:
  nvm:
    ipam:
      config:
        - subnet: ${NVM_SUBNET:-172.30.94.0/24}
          # Ditetapkan supaya tidak bergeser saat jaringan dibuat ulang.
          gateway: ${NVM_GATEWAY_IP:-172.30.94.1}
  postgres:
    external: true
    name: ${PG_NETWORK:-nvm-internal_default}
