name: nvm-internal

services:
  postgres:
    image: postgres:18-alpine
    container_name: nvm-internal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    ports:
      # hanya bisa diakses dari dalam server; dari laptop lewat SSH tunnel
      - "127.0.0.1:5432:5432"
    volumes:
      # image 18 ke atas menyimpan data di subfolder per versi, jadi yang di-mount folder induknya
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
